# Blueprint de Render (Infrastructure as Code).
# Crea solo el servicio web Node. La base de datos es externa (Neon) y se
# conecta mediante DATABASE_URL, que se define a mano en el dashboard.
#
# Por qué no se usa el Postgres de Render: su capa gratuita caduca a los 30
# días. Neon ofrece un PostgreSQL gratuito sin caducidad.
#
# Si prefieres el Postgres de Render, descomenta el bloque `databases` de
# abajo y sustituye la variable DATABASE_URL de `sync: false` por:
#
#   - key: DATABASE_URL
#     fromDatabase:
#       name: tablero-db
#       property: connectionString
#
# databases:
#   - name: tablero-db
#     databaseName: tablero
#     user: tablero
#     plan: free
#     region: frankfurt

services:
  - type: web
    name: tablero
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Cadena de conexión de Neon, por ejemplo:
      # postgresql://usuario:clave@ep-xxx.region.aws.neon.tech/tablero?sslmode=require
      # No se guarda en el repositorio: se rellena en el dashboard de Render.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
